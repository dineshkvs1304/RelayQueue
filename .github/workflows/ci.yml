
name: RelayQueue CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: relayqueue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d relayqueue_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff
        run: |
          ruff check src tests

      - name: Run tests
        env:
           RELAYQUEUE_DB_HOST: localhost
           RELAYQUEUE_DB_PORT: 5432
           RELAYQUEUE_DB_USER: postgres
           RELAYQUEUE_DB_PASS: Dinesh@13
           RELAYQUEUE_DB_NAME: relayqueue_test

        run: |
       
          pytest
